# Local bundle: one loopback port; native applications remain private.
services:
  astrbot:
    image: soulter/astrbot:v4.25.1
    init: true
    working_dir: /AstrBot
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Run deploy/setup.sh first}
      QWENPAW_RUNTIME_INTERNAL_TOKEN: ${QWENPAW_RUNTIME_INTERNAL_TOKEN:?Run deploy/setup.sh
        first}
      QWENPAW_BASE_URL: ${QWENPAW_BASE_URL:-http://qwenpaw:8088}
      QWENPAW_AGENT_ID: ${QWENPAW_AGENT_ID:-default}
      OWNER_USER_IDS: ${OWNER_USER_IDS:-}
      TOOL_ALLOWLIST: ${TOOL_ALLOWLIST:-}
      BRIDGE_FILES_ROOT: /bridge-files
      BRIDGE_MAX_FILE_BYTES: ${BRIDGE_MAX_FILE_BYTES:-20971520}
      BRIDGE_MAX_FILES: ${BRIDGE_MAX_FILES:-4}
      BRIDGE_MEDIA_TIMEOUT: ${BRIDGE_MEDIA_TIMEOUT:-60}
      BRIDGE_SOURCE_ROOTS: ${BRIDGE_SOURCE_ROOTS:-/AstrBot/data/temp}
      BRIDGE_NAPCAT_HOSTS: ${BRIDGE_NAPCAT_HOSTS:-napcat}
    expose:
    - '6199'
    - '9186'
    volumes:
    - ${INSTALL_ROOT:?}/state/astrbot:/AstrBot/data
    - ${PROJECT_SOURCE:?}/astrbot_plugin_qwenpaw_bridge:/AstrBot/data/plugins/astrbot_plugin_qwenpaw_bridge:ro
    - ${INSTALL_ROOT:?}/state/bridge-files:/bridge-files
    mem_limit: ${ASTRBOT_MEMORY:-640m}
    memswap_limit: ${ASTRBOT_SWAP:-1280m}
    cpus: '1.0'
    pids_limit: 256
    security_opt:
    - no-new-privileges:true
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:6185/',timeout=5).status
        == 200
      interval: 30s
      timeout: 8s
      start_period: 120s
      retries: 5
    networks:
    - bridge
  qwenpaw:
    # Official v2.2.1; registry provenance confirms the fixed source commit.
    image: agentscope-registry.ap-southeast-1.cr.aliyuncs.com/agentscope/qwenpaw@sha256:4127130c41f415434aca5a9ea8eada99d3185d99e2bf181bd95c6e7fb959a3a7
    pull_policy: missing
    init: true
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      QWENPAW_PORT: '8088'
      QWENPAW_AGENT_ID: ${QWENPAW_AGENT_ID:-default}
      QWENPAW_ENABLED_CHANNELS: console,astrbot
      QWENPAW_RUNTIME_INTERNAL_TOKEN: ${QWENPAW_RUNTIME_INTERNAL_TOKEN:?Run deploy/setup.sh
        first}
      QWENPAW_AUTH_ENABLED: ${QWENPAW_AUTH_ENABLED:-false}
      ASTRBOT_BRIDGE_URL: http://astrbot:9186
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Run deploy/setup.sh first}
      BRIDGE_FILES_ROOT: /bridge-files
      BRIDGE_MAX_FILE_BYTES: ${BRIDGE_MAX_FILE_BYTES:-20971520}
      BRIDGE_MAX_FILES: ${BRIDGE_MAX_FILES:-4}
    expose:
    - '8088'
    volumes:
    - ${INSTALL_ROOT:?}/state/qwenpaw/working:/app/working
    - ${INSTALL_ROOT:?}/state/qwenpaw/secret:/app/working.secret
    - ${INSTALL_ROOT:?}/state/qwenpaw/backups:/app/working.backups
    - ${PROJECT_SOURCE:?}/qwenpaw_plugin_astrbot_bridge:/app/working/plugins/qwenpaw_plugin_astrbot_bridge:ro
    - ${INSTALL_ROOT:?}/state/bridge-files:/bridge-files
    shm_size: 256m
    mem_limit: ${QWENPAW_MEMORY:-1536m}
    memswap_limit: ${QWENPAW_SWAP:-3072m}
    cpus: '1.5'
    pids_limit: 1024
    security_opt:
    - no-new-privileges:true
    logging: *id001
    networks:
    - bridge
  napcat:
    image: mlikiowa/napcat-docker:v4.18.33
    init: true
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NAPCAT_UID: '0'
      NAPCAT_GID: '0'
    volumes:
    - ${INSTALL_ROOT:?}/state/napcat/config:/app/napcat/config
    - ${INSTALL_ROOT:?}/state/napcat/qq:/app/.config/QQ
    - ${INSTALL_ROOT:?}/state/bridge-files:/bridge-files:ro
    shm_size: 128m
    mem_limit: ${NAPCAT_MEMORY:-768m}
    memswap_limit: ${NAPCAT_SWAP:-1536m}
    cpus: '1.0'
    pids_limit: 512
    ulimits:
      core: 0
    logging: *id001
    networks:
    - bridge
    expose:
    - '6099'
  gateway:
    build:
      context: ${PROJECT_SOURCE:?}
      dockerfile: bundle_gateway/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      QWENPAW_RUNTIME_INTERNAL_TOKEN: ${QWENPAW_RUNTIME_INTERNAL_TOKEN:?}
      QWENPAW_AGENT_ID: ${QWENPAW_AGENT_ID:-default}
      BUNDLE_PORT: '18080'
    ports:
    - 127.0.0.1:18080:18080
    networks:
    - bridge
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  bridge:
    driver: bridge
