name: Bridge checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts bundle_gateway
      - run: |
          for script in deploy/*.sh; do bash -n "$script"; done
      - name: Validate Compose without deploying
        run: |
          python deploy/prepare.py --mode fresh --root "$RUNNER_TEMP/bot-combined"
          docker compose --env-file "$RUNNER_TEMP/bot-combined/.env" -f deploy/compose.yaml config --quiet
          docker compose --env-file "$RUNNER_TEMP/bot-combined/.env" -f deploy/compose.bundle.yaml config --quiet
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_windows_launcher.py -v
  bundle-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          npm install --prefix "$RUNNER_TEMP/bundle-browser" --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/bundle-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node scripts/check_bundle_ui.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/bundle-browser/node_modules
