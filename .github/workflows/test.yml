name: Bridge checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: |
          for script in deploy/*.sh; do bash -n "$script"; done
      - name: Validate Compose without deploying
        run: |
          python deploy/prepare.py --mode fresh --root "$RUNNER_TEMP/bot-combined"
          docker compose --env-file "$RUNNER_TEMP/bot-combined/.env" -f deploy/compose.yaml config --quiet
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated UI test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/workbench-ui" --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/workbench-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check desktop and mobile interactions
        run: node scripts/check_workbench_ui.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/workbench-ui/node_modules
